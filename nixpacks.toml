# nixpacks.toml
# System packages for OpenCV + Tesseract OCR on Railway (Ubuntu/Debian based)

[phases.setup]
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-chi-sim",
    "libglib2.0-0",
    "libgl1",
    "libsm6",
    "libxext6",
    "libxrender-dev",
    "libgomp1",
]

[phases.build]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python main.py"
