# nixpacks.toml
# System packages for OpenCV + Tesseract OCR on Railway (Ubuntu/Debian based)

[phases.setup]
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-chi-sim",
    "libglib2.0-0",
    "libgl1",
    "libsm6",
    "libxext6",
    "libxrender-dev",
    "libgomp1",
]

[phases.install]
cacheDirectories = ["/root/.cache/pip"]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "python main.py"

